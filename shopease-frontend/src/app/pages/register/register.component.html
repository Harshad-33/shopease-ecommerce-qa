<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white text-center py-4">
          <div class="mb-2">
            <i class="bi bi-person-plus-fill fs-1 text-warning"></i>
          </div>
          <h4 class="fw-bold mb-1">Create Your Account</h4>
          <p class="text-white-50 small mb-0">Join ShopEase for exclusive deals and effortless shopping</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <!-- Error Alert -->
          <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
            <div>{{ errorMessage }}</div>
          </div>

          <form (ngSubmit)="onSubmit()">
            <!-- Full Name -->
            <div class="mb-3">
              <label for="full-name" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input
                  type="text"
                  class="form-control"
                  id="full-name"
                  placeholder="e.g. John Doe"
                  [(ngModel)]="user.fullName"
                  name="fullName"
                  required
                />
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="name@example.com"
                  [(ngModel)]="user.email"
                  name="email"
                  required
                />
              </div>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label fw-semibold">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  placeholder="10-digit mobile number"
                  [(ngModel)]="user.phone"
                  name="phone"
                  required
                />
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="At least 6 characters"
                  [(ngModel)]="user.password"
                  name="password"
                  required
                />
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="confirm-password" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="confirm-password"
                  placeholder="Re-enter password"
                  [(ngModel)]="user.confirmPassword"
                  name="confirmPassword"
                  required
                />
              </div>
            </div>

            <button
              id="register-button"
              type="submit"
              class="btn btn-primary w-100 py-2 fs-5 fw-bold shadow-sm"
              [disabled]="loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ loading ? 'Creating Account...' : 'Register' }}
            </button>
          </form>

          <!-- Login Link -->
          <div class="text-center mt-4 pt-2">
            <p class="text-muted mb-0">
              Already have an account?
              <a id="login-link-btn" routerLink="/login" class="text-primary fw-bold text-decoration-none">
                Sign In here
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
